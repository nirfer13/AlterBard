server: # REST and WS server
  port: 2333
  address: 127.0.0.1
spring:
  main:
    banner-mode: log
lavalink:
  plugins:
    # The plugin version MUST be kept current. YouTube regularly changes the
    # script that deciphers stream URLs; an old plugin stops understanding it
    # and EVERY track fails with "Must find action functions from script".
    # Lavalink downloads the version given here into plugins/ on startup.
    # Latest releases: https://github.com/lavalink-devs/youtube-source/releases
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false # Set to true if you want to use a snapshot version.

    # You can configure individual clients with the following.
    # Any options or clients left unspecified will use their default values
    # for those individual clients.
    # Client configurations will ONLY take effect if the client is registered above,
    # otherwise they are ignored.
    # ---------------- WARNING ----------------
    # This part of the config is for DEMONSTRATION PURPOSES ONLY!
    # Do NOT use this config before understanding what the options do.
    # You do NOT need to copy this config just because it is published here.
    # ---------------- WARNING ----------------
  server:
    password: "youshallnotpass"
    sources:
      youtube: false
      bandcamp: false
      soundcloud: true
      twitch: false
      vimeo: false
      mixer: false
      http: false
      local: false
    bufferDurationMs: 800
    frameBufferDurationMs: 15000 # How many milliseconds of audio to keep buffered
    opusEncodingQuality: 10 # Opus encoder quality. Valid values range from 0 to 10, where 10 is best quality but is the most expensive on the CPU.
    resamplingQuality: LOW # Quality of resampling operations. Valid values are LOW, MEDIUM and HIGH, where HIGH uses the most CPU.
    trackStuckThresholdMs: 10000 # The threshold for how long a track can be stuck. A track is stuck if does not return any audio data.
    useSeekGhosting: true # Seek ghosting is the effect where whilst a seek is in progress, the audio buffer is read from until empty, or until seek is ready.
    youtubePlaylistLoadLimit: 6 # Number of pages at 100 each
    playerUpdateInterval: 5 # How frequently to send player updates to clients, in seconds
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""
#  tags:
#    some_key: some_value
#    another_key: another_value

logging:
  file:
    path: ./logs/

  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO

  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000


  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30

plugins:
  youtube:
      enabled: true # Whether this source can be used.
      allowSearch: true # Whether "ytsearch:" and "ytmsearch:" can be used.
      allowDirectVideoIds: true # Whether just video IDs can match. If false, only complete URLs will be loaded.
      allowDirectPlaylistIds: true # Whether just playlist IDs can match. If false, only complete URLs will be loaded.
      # The clients to use for track loading. See below for a list of valid clients.
      # Clients are queried in the order they are given (so the first client is queried first and so on...)
      clients:
        - MUSIC
        - ANDROID_VR
        - WEB
        - WEBEMBEDDED
        # TV belongs here only together with OAuth below - it is the only
        # OAuth-capable client, and without a token it cannot play anything,
        # so leaving it in would just add a failed attempt per track.
      oauth:
        # Off on purpose. Playback works fine through the clients above, and an
        # enabled-but-unauthorised OAuth is not harmless: the device code has to
        # be entered at https://www.google.com/device within minutes, and once
        # it expires the poller keeps hitting Google every 5 seconds and logging
        # a full stack trace for "Invalid status code for oauth2 token fetch: 400"
        # - forever, filling spring.log for no benefit.
        #
        # Turn this on only if YouTube starts rejecting the bot ("Sign in to
        # confirm you're not a bot"). Then: add TV back to the client list above,
        # authorise ONCE with a burner account - never your main one - and paste
        # the resulting refresh token into refreshToken so a restart does not
        # send you through the whole dance again.
        enabled: false # Whether to enable OAuth for the YouTube plugin.
        # refreshToken: "paste the refresh token here after authorising"